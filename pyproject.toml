[project]
name = "huggingface-collection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.56.1",
    "datasets>=4.0.0",
    "bitsandbytes>=0.46.1",
    "accelerate>=1.9.0",
    "peft>=0.17.1",
    "python-dotenv>=1.2.1",
    "math-verify>=0.9.0",
    "unsloth>=2026.1.4",
    "mlflow>=3.9.0",
    "unsloth-zoo>=2026.1.4",
    "trl==0.19.1",
    "gradio>=6.5.1",
    "ollama>=0.6.1",
    "pyyaml>=6.0.3",
]


[tool.ruff]
lint.select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
    "C4",
    "SIM",
    "ARG",
    "PIE",
    # "T20",
    "Q",
    "N",
]
lint.ignore = ["B905", "B008", "B904", "F811", "E501"]
lint.fixable = ["B", "F", "I", "UP"]
lint.unfixable = []
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini_options]
pythonpath = "src"
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_cli_format = "%(levelname)-8s %(asctime)s %(name)s:%(funcName)s:L%(lineno)d %(message)s"

# [tool.rye.scripts]
# "prod" = { cmd = "python src/main.py" }
# "dev" = { cmd = "python src/main.py", env = { "PYTHONDEVMODE" = "1" } }
# "test" = { cmd = "pytest --durations=5", env = { "PYTHONDEVMODE" = "1" } }
# "test:cov" = { cmd = "pytest --cov" }
# "type" = { cmd = "mypy" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
